name: Creator Header Step 1

on:
  push:
    branches:
      - feature/creator-platform-subscription

permissions:
  contents: write

jobs:
  apply-header:
    if: ${{ !contains(github.event.head_commit.message, 'apply global creator header') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Creator global header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/creators/page.tsx')
          s = p.read_text()
          start = s.index('  <header className="topbar">')
          end = s.index('</header>', start) + len('</header>')
          new_header = '''  <header className="topbar">
    <button className="brand" type="button" onClick={() => router.push("/")}>RALL<span>IVIO</span><small>CREATORS. BRANDS. A BRIGHTER TOMORROW.</small></button>
    <nav>
      <button type="button" onClick={() => router.push("/living")}>Discover</button>
      <button type="button" className="active">Creators</button>
      <button type="button" onClick={() => notify("Brands & Opportunities workspace is coming next.")}>Brands &amp; Opportunities</button>
      <button type="button" onClick={() => notify("Community workspace is coming next.")}>Community</button>
      <button type="button" onClick={() => notify("About RALLIVIO — the living creator-economy discovery ecosystem.")}>About</button>
    </nav>
    <div className="tools">
      <form className="search" onSubmit={e=>{e.preventDefault();setQuery(input.trim()||"Travel with Alex")}}><span>⌕</span><input value={input} onChange={e=>setInput(e.target.value)} placeholder="Search anything: creators, brands, videos, trends…"/><button type="submit" aria-label="Search">↗</button></form>
      <button className="plusBtn" type="button" onClick={()=>setPlans(true)}>✦ RALLIVIO+</button>
      <button className="theme" type="button" onClick={()=>setLight(v=>!v)} aria-label="Toggle theme">☼</button>
      <button className="authLogin" type="button" onClick={()=>notify("Login will connect to RALLIVIO account authentication.")}>Log in</button>
      <button className="authSignup" type="button" onClick={()=>notify("Sign up will connect to RALLIVIO account creation.")}>Sign up</button>
    </div>
  </header>'''
          s = s[:start] + new_header + s[end:]
          marker = '.topbar{height:68px;'
          inject = '''.topbar{height:68px;'''
          # Preserve the existing Creator stylesheet but align the header to the Discover shell.
          extra = '''.creator-page .topbar{height:68px;padding:12px 34px;gap:18px}.creator-page .brand{position:relative;padding:0 105px 0 0;font-size:28px;font-weight:950;letter-spacing:-1.7px;line-height:.85}.creator-page .brand b{display:none}.creator-page .brand span{color:#a868ff}.creator-page .brand small{left:0;bottom:-10px;font-size:6px;letter-spacing:1px;color:#aaa9c1}.creator-page .topbar nav{display:flex;gap:3px;flex:1}.creator-page .topbar nav button{border:0;background:transparent;padding:10px 13px;border-radius:999px;color:#deddef;font-weight:650}.creator-page .topbar nav button.active,.creator-page .topbar nav button:hover{background:linear-gradient(135deg,#8544ff,#bd61ff);color:#fff}.creator-page .tools{gap:5px}.creator-page .search{width:min(390px,29vw);height:42px;border-radius:24px;background:#050611aa}.creator-page .plusBtn{border:1px solid #6536a1!important;border-radius:999px!important;background:#25163a!important}.creator-page .theme{width:40px;height:40px;padding:0!important;border:1px solid #ffffff1b!important;border-radius:50%!important}.creator-page .authLogin,.creator-page .authSignup{padding:9px 13px!important;border-radius:999px!important}.creator-page .authLogin{border:1px solid #ffffff1b!important;background:transparent!important;color:#deddef!important}.creator-page .authSignup{background:linear-gradient(135deg,#8544ff,#bd61ff)!important;color:#fff!important}.creator-page.light .authLogin{color:#596277!important;border-color:#dfe4ef!important}.creator-page.light .authSignup{color:#fff!important}'''
          s = s.replace('}</style>', extra + '}</style>', 1)
          p.write_text(s)
          PY
      - name: Commit patched header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/creators/page.tsx
          git diff --cached --quiet || git commit -m "chore: apply global creator header step 1"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/creator-header-step1.yml
          git commit -m "chore: remove one-time creator header workflow"
          git push
