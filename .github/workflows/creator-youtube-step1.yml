name: Creator YouTube Step 1

on:
  push:
    branches:
      - feature/creator-platform-subscription

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply creator youtube step 1') && !contains(github.event.head_commit.message, 'remove creator youtube step 1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted Creator YouTube interaction patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/creators/page.tsx')
          s = p.read_text()
          old = '''function choosePlatform(p:string){setPlatform(p);if(p!=="YouTube"&&p!=="All Platforms")notify(`${p} is not connected yet. YouTube remains the live source.`)}'''
          new = '''function choosePlatform(p:string){
           setPlatform(p);
           if(p==="YouTube"){
            notify("YouTube selected — refreshing live YouTube data…");
            void load();
            return;
           }
           if(p!=="All Platforms")notify(`${p} is not connected yet. YouTube remains the live source.`)
          }'''
          if old not in s: raise SystemExit('choosePlatform target not found')
          s=s.replace(old,new,1)
          old='''{error&&<div className="status error">YouTube: {error}<button onClick={load}>Retry</button></div>}'''
          new='''{error&&<div className="status error">{error==="YOUTUBE_API_NOT_CONFIGURED"?<>YouTube live data is not configured on this Vercel preview. The Creator UI is connected to the real YouTube adapter, but this deployment has no <code>YOUTUBE_API_KEY</code> available yet.</>:<>YouTube: {error}</>}<button onClick={load}>Retry</button></div>}'''
          if old not in s: raise SystemExit('error target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit targeted patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/creators/page.tsx
          git commit -m "chore: apply creator youtube step 1"
          git push
